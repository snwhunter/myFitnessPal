<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>myFitnessPal</title><link rel="stylesheet" href="styles.css"><script type="module" src="app.js?v=0.3.1"></script></head>
<body><div class="app"><header><a class="brand" href="?">myFitnessPal</a><span id="userName"></span></header><main>
<p id="message" role="status">Loading your dashboard…</p>
<section id="dashboard" hidden aria-labelledby="dashboardTitle">
<div class="heading"><div><p class="eyebrow">YOUR DASHBOARD</p><h1 id="dashboardTitle"></h1></div><span class="pill">Daily · 2 sessions</span></div>
<section class="metrics" aria-label="Workout metrics"><div><strong id="todaySessions">0 / 2</strong><span>Today’s sessions</span></div><div><strong id="todayExercises">0 / 14</strong><span>Today’s exercises</span></div><div><strong id="weekSessions">0 / 14</strong><span>Past 7 days</span></div></section>
<p id="saveNotice" class="muted">Progress is saved on this device.</p>
<section class="sessions-section" aria-labelledby="sessionsTitle"><div class="heading"><h2 id="sessionsTitle">Sessions</h2><button id="todayButton" class="text-button">Today</button></div>
<div class="date-nav"><button id="previousDate" class="nav-button" aria-label="Previous day">‹</button><div id="dateRoller" class="date-roller" aria-label="Choose a workout date"></div><button id="nextDate" class="nav-button" aria-label="Next day">›</button></div>
<label class="date-picker">Jump to date <input id="datePicker" type="date"></label><h3 id="selectedDateLabel"></h3><div id="sessions"></div></section></section>
<section id="workout" hidden aria-labelledby="workoutTitle"><button id="backButton" class="text-button">← Dashboard</button><div class="heading workout-heading"><div><p id="sessionLabel" class="eyebrow"></p><h1 id="workoutTitle"></h1></div><span id="count" class="muted" aria-live="polite"></span></div><div class="progress" role="progressbar" aria-label="Session completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div><div id="list"></div></section>
</main><footer class="muted" style="padding:16px;text-align:center"><small id="appVersion">v0.3.1</small></footer></div></body></html>
